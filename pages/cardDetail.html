<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Print Shirt | Cloth Store</title>
    <link rel="stylesheet" href="../assets/CSS/cardDetails.css">
</head>
<body>
    <div class="page-wrapper">
        <header>
            <div class="header-left">
                <button type="button" class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-navigation">
                    &#9776;
                </button>
                <nav id="site-navigation" class="main-nav" aria-label="Main navigation">
                    <ul>
                       <li><a href="../index.html" aria-current="page">Home</a></li>
                       <li><a href="products.html">Collections</a></li>
                       <li><a href="#">New</a></li>
                    </ul>
                </nav>
            </div>

            <a href="../index.html" aria-label="Cloth Store home">
                <span class="logo" aria-hidden="true"></span>
            </a>

            <nav class="user-actions" aria-label="User actions">
                <ul>
                    <li>
                        <button type="button" class="icon-circle" aria-label="View wishlist">&#9729;</button>
                    </li>
                    <li>
                        <a href="/cart" class="cart-pill" aria-label="View shopping cart">
                            <span>Cart</span>
                            <span class="icon-circle" aria-hidden="true">&#128092;</span>
                        </a>
                    </li>
                    <li>
                        <button type="button" class="icon-circle" aria-label="View account">&#128100;</button>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            

            <section class="product-detail" aria-labelledby="product-title">
                <div class="product-detail-card">
                <div class="product-gallery">
                    <ul class="thumbnail-list" aria-label="Product images">
                        <li>
                            <button class="thumbnail" type="button" aria-selected="true" aria-label="Show product image 1">
                                <img src="../assets/images/cardDetails/145cb6cef068c6de9269b418898ca5c6fcbf507b.jpg" alt="">
                            </button>
                        </li>
                        <li>
                            <button class="thumbnail" type="button" aria-selected="false" aria-label="Show product image 2">
                                <img src="../assets/images/cardDetails/473cf109c5de16744da27ab1fe532e88a298c151.jpg" alt="">
                            </button>
                        </li>
                        <li>
                            <button class="thumbnail" type="button" aria-selected="false" aria-label="Show product image 3">
                                <img src="../assets/images/cardDetails/76dd060158d6b1fe3783b073b0394f9caaf7d936%20(1).jpg" alt="">
                            </button>
                        </li>
                        <li>
                            <button class="thumbnail" type="button" aria-selected="false" aria-label="Show product image 4">
                                <img src="../assets/images/cardDetails/95b4d7fad816f6024c517ca6660f0fb21102af21.jpg" alt="">
                            </button>
                        </li>
                    </ul>

                    <figure class="main-image-frame">
                        <img id="main-product-image" src="../assets/images/cardDetails/0193c0f6281560910dc42eeaf0507393821fd4b1.jpg" alt="Abstract Print Shirt">
                    </figure>
                </div>

                <div class="product-copy">
                    <h1 id="product-title">ABSTRACT PRINT SHIRT</h1>
                    <p class="price">$ 99</p>
                    <p class="tax-note">MRP incl. of all taxes</p>
                    <p class="description">Relaxed-fit shirt. Camp collar and short sleeves. Button-up front.</p>

                    <div class="option-group">
                        <span class="option-label">Colors</span>
                        <ul class="color-options" aria-label="Choose a color">
                            <li><button class="color-button color-black" type="button" aria-label="Black" aria-pressed="true"></button></li>
                            <li><button class="color-button color-cream" type="button" aria-label="Cream" aria-pressed="false"></button></li>
                            <li><button class="color-button color-blue" type="button" aria-label="Blue" aria-pressed="false"></button></li>
                            <li><button class="color-button color-red" type="button" aria-label="Red" aria-pressed="false"></button></li>
                            <li><button class="color-button color-green" type="button" aria-label="Green" aria-pressed="false"></button></li>
                            <li><button class="color-button color-orange" type="button" aria-label="Orange" aria-pressed="false"></button></li>
                        </ul>
                    </div>

                    <button class="add-button" type="button">Add</button>
                </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
